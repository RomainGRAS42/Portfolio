
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romain Gras | UI-UX Designer & No-Code</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }
        .font-heading {
            font-family: 'Outfit', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .hero-gradient {
            background: radial-gradient(circle at 50% 50%, #0a0a0a 0%, #000 100%);
        }
        .bg-grain::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.02;
            pointer-events: none;
            z-index: 50;
            background-image: url("https://grainy-gradients.vercel.app/noise.svg");
        }
        @keyframes revealText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-reveal {
            animation: revealText 0.8s cubic-bezier(0.2, 1, 0.3, 1) forwards;
        }
        :focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
        .text-zinc-500 { color: #a1a1aa !important; }
        .text-zinc-400 { color: #d4d4d8 !important; }
    </style>
